name: Odin iOS (experimental)

# An unsigned .ipa of Odin for iPhone, built on a Mac: the Odin of
# odin-android with its patch (the phone's menus, touch pad, folders, shared
# with Android), Vulkan through MoltenVK. Sideloaded (SideStore, AltStore);
# its games need the JIT a debugger enables (StikDebug).
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      android_ref:
        description: "The branch (or commit) of odin-android whose patch is built"
        default: main

permissions:
  contents: write
  # The .ipa of earlier runs, kept as their versions (gh run download)
  actions: read

# One at a time, whatever the branch: they all publish the same release
concurrency:
  group: odin-ios
  cancel-in-progress: false

jobs:
  ipa:
    # macos-15-intel: the arm64 Macs of GitHub are often saturated (a job
    # waited hours in the queue); the .ipa is cross-compiled either way
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version
        run: echo "ODIN_IOS_VERSION=$(tr -d '[:space:]' < version.txt).$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      # The branch of odin-android of the same name as this one when there is
      # one (a patch tried for iOS before it is merged), else main
      - name: Which odin-android
        env:
          WANT: ${{ inputs.android_ref || vars.ODIN_ANDROID_REF }}
        run: |
          ref="$WANT"
          if [ -z "$ref" ] && [ "$GITHUB_REF_NAME" != main ] &&
             git ls-remote --exit-code --heads https://github.com/Laurent-67370/odin-android "$GITHUB_REF_NAME" >/dev/null; then
            ref="$GITHUB_REF_NAME"
          fi
          echo "ANDROID_REF=${ref:-main}" >> "$GITHUB_ENV"
          echo "odin-android: ${ref:-main}"
      - name: odin-android (the patch of Odin, shared with the APK)
        uses: actions/checkout@v4
        with:
          repository: Laurent-67370/odin-android
          ref: ${{ env.ANDROID_REF }}
          path: odin-android
      - name: Tools
        run: brew install glslang ninja gawk
      - name: Odin's sources, patched
        run: |
          odin-android/fetch-odin.sh
          echo "ODIN_COMMIT=$(cat odin-android/odin.version)" >> "$GITHUB_ENV"
          echo "ODIN_ANDROID_SHA=$(git -C odin-android rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: OpenGL ES 3.2 headers (Khronos), the functions iOS lacks stubbed
        run: |
          mkdir -p khr/GLES3 khr/GLES2 khr/KHR
          base=https://raw.githubusercontent.com/KhronosGroup
          curl -fsSL -o khr/GLES3/gl32.h $base/OpenGL-Registry/main/api/GLES3/gl32.h
          curl -fsSL -o khr/GLES3/gl3platform.h $base/OpenGL-Registry/main/api/GLES3/gl3platform.h
          curl -fsSL -o khr/GLES2/gl2ext.h $base/OpenGL-Registry/main/api/GLES2/gl2ext.h
          curl -fsSL -o khr/GLES2/gl2platform.h $base/OpenGL-Registry/main/api/GLES2/gl2platform.h
          curl -fsSL -o khr/KHR/khrplatform.h $base/EGL-Registry/main/api/KHR/khrplatform.h
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          python3 ios/gl-stubs.py khr/GLES3/gl32.h "$sdk/System/Library/Frameworks/OpenGLES.framework/Headers/ES3/gl.h" khr/gl_stubs.c
      - name: MoltenVK (Vulkan on Metal)
        run: |
          curl -fsSL -o moltenvk.tar https://github.com/KhronosGroup/MoltenVK/releases/latest/download/MoltenVK-ios.tar
          tar xf moltenvk.tar
          find . -type d -name 'MoltenVK.framework' -path '*ios-arm64/*' | grep -v simulator | head -5
      - name: Odin for iOS (arm64)
        run: |
          cmake -S odin-android/odin-src -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 \
            -DODIN_BUNDLED_LIBS=ON -DODIN_NATIVE=OFF -DODIN_LTO=OFF \
            -DGLSLANG="$(command -v glslangValidator)" -DAWK="$(command -v gawk)" \
            -DODIN_GLES_HEADERS="$PWD/khr" -DODIN_GL_STUBS="$PWD/khr/gl_stubs.c" \
            -DODIN_VERSION="ios-${ODIN_IOS_VERSION}-odin-${ODIN_COMMIT::7}"
          ninja -C build -k 0 2>&1 | tee build.log | grep -E 'error:|FAILED|undefined' | sort -u | head -80
          test -x build/bin/Odin.app/Odin
      - name: The .ipa (unsigned)
        run: |
          app=build/bin/Odin.app
          cp -R build/share/odin/. "$app/"
          mkdir -p "$app/Frameworks"
          cp -R "$(find . -type d -name 'MoltenVK.framework' -path '*dynamic*ios-arm64/*' | grep -v simulator | head -1)" "$app/Frameworks/"
          # Where Odin gives it to SDL (SDL looks for libvulkan.dylib alone):
          # without it, no Vulkan, a black screen
          lipo -info "$app/Frameworks/MoltenVK.framework/MoltenVK" | grep -q arm64
          mkdir Payload && cp -R "$app" Payload/ && zip -qr odin.ipa Payload
          ls -l odin.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-ios
          path: |
            odin.ipa
            build.log
      # Published from main alone: a branch's .ipa is in its artifact
      - name: Published (release "odin-ios")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Every release of the tag odin-ios deleted, drafts too (one left a
        # draft: the link to odin.ipa then fails), the tag put on this commit
        # first, the release checked published
        run: |
          repo="$GITHUB_REPOSITORY"
          for id in $(gh api "repos/$repo/releases" --paginate --jq '.[] | select(.tag_name == "odin-ios") | .id'); do
            gh api -X DELETE "repos/$repo/releases/$id"
          done
          gh api -X DELETE "repos/$repo/git/refs/tags/odin-ios" || true
          gh api "repos/$repo/git/refs" -f ref=refs/tags/odin-ios -f sha="$GITHUB_SHA" >/dev/null
          gh release create odin-ios odin.ipa --verify-tag --prerelease \
            --title "Odin iOS ${ODIN_IOS_VERSION} (experimental)" \
            --notes "Experimental, unsigned build of Odin for iPhone (arm64, iOS 16.3+), from Odin ${ODIN_COMMIT::7}, odin-android ${ODIN_ANDROID_SHA} and odin-ios ${GITHUB_SHA::7}. Sideload odin.ipa with SideStore or AltStore. In Odin, MENU, File, Add games... picks hikaru.zip, mie.zip and the games from Files and copies them to the app's folder roms/ (they can also be put there by hand: Files app, On My iPhone, Odin; with LiveContainer, inside its folder). MENU, File, Get homebrew games... downloads the free games made for Odin, each told new, installed or with an update. The games run without JIT, about half as fast; with JIT enabled by StikDebug (on iOS 26 and later with its script universal.js), at full speed. odin.log says JIT: on or JIT: off."
          test "$(gh release view odin-ios --json isDraft --jq .isDraft)" = false
      # Every version kept too, as its own release ios-<version>: this one,
      # and those of the earlier runs of main from 0.1.8 on, from their
      # artifacts (kept 90 days), when they have no release yet. Their notes
      # say what each brought (the title of its change). An earlier one is
      # tagged on this commit: GitHub refuses this workflow a tag on a
      # commit whose workflow differs; its notes name the commit it was
      # built from.
      - name: Every version (releases ios-0.1.NNN)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          # The tag ios-0.1.008: GitHub lists the releases by their tags as
          # text, so the number on three digits keeps 0.1.8 below 0.1.13
          tag_of() { echo "ios-${1%.*}.$(printf '%03d' "${1##*.}")"; }
          keep() {
            tag=$(tag_of "$1")
            if gh release view "$tag" >/dev/null 2>&1; then return 0; fi
            gh api "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
            gh release create "$tag" "$2" --verify-tag --prerelease --title "Odin iOS $1 (experimental)" --notes "$3"
          }
          about() {
            echo "$(git log -1 --format=%s "$1" | sed 's/ (#[0-9]*)$//')."
          }
          keep "$ODIN_IOS_VERSION" odin.ipa \
            "$(about "$GITHUB_SHA") Odin for iPhone $ODIN_IOS_VERSION (experimental, unsigned), from Odin ${ODIN_COMMIT::7}, odin-android ${ODIN_ANDROID_SHA} and odin-ios ${GITHUB_SHA::7}. What each version brought: the README. The latest build is always in the release odin-ios."
          base="$(tr -d '[:space:]' < version.txt)"
          for run in $(gh run list --workflow ios.yml --branch main --status success --limit 100 \
                       --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            id="${run%%:*}"; sha="${run#*:}"
            [ "$sha" = "$GITHUB_SHA" ] && continue
            count=$(git rev-list --count "$sha" 2>/dev/null) || continue
            [ "$count" -ge 8 ] || continue
            if gh release view "$(tag_of "$base.$count")" >/dev/null 2>&1; then continue; fi
            rm -rf earlier
            gh run download "$id" -n odin-ios -D earlier >/dev/null 2>&1 || continue
            [ -f earlier/odin.ipa ] || continue
            keep "$base.$count" earlier/odin.ipa \
              "$(about "$sha") Earlier build of Odin for iPhone (experimental, unsigned), built from odin-ios ${sha::7} (run $id). What each version brought: the README. The latest build is always in the release odin-ios."
          done
      # The releases made before the tags had three digits (ios-0.1.8)
      # made again under them (ios-0.1.008), their title and notes kept
      - name: The tags of the versions on three digits
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^ios-[0-9]+\.[0-9]+\.[0-9]{1,2}$' | sort -V); do
            new="ios-${old#ios-}"; new="${new%.*}.$(printf '%03d' "${old##*.}")"
            if ! gh release view "$new" >/dev/null 2>&1; then
              rm -rf again && mkdir again
              gh release download "$old" -p odin.ipa -D again
              title=$(gh release view "$old" --json name --jq .name)
              gh release view "$old" --json body --jq .body > again/notes.txt
              gh api "repos/$repo/git/refs" -f ref="refs/tags/$new" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
              gh release create "$new" again/odin.ipa --verify-tag --prerelease --title "$title" --notes-file again/notes.txt
            fi
            gh release delete "$old" --yes --cleanup-tag
          done
